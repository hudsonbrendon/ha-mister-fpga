[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN", "ASYNC", "RUF"]
# D1/ANN0/ANN2: pre-existing undocumented/unannotated defs; enable when annotating.
ignore = ["D203", "D213", "ANN401", "RUF012", "E501", "D1", "ANN0", "ANN2"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.mister_fpga"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "RUF", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -p no:cacheprovider"
