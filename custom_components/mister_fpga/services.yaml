launch_game:
  fields:
    entry_id:
      required: true
      selector:
        text:
    path:
      required: true
      example: "/media/fat/games/SNES/Chrono Trigger.sfc"
      selector:
        text:

launch_system:
  fields:
    entry_id:
      required: true
      selector:
        text:
    system_id:
      required: true
      example: "SNES"
      selector:
        text:

search_games:
  fields:
    entry_id:
      required: true
      selector:
        text:
    query:
      required: true
      example: "chrono"
      selector:
        text:
    system:
      example: "SNES"
      selector:
        text:
    page:
      example: 1
      selector:
        number:
          min: 1
          max: 10000
          mode: box

send_keyboard:
  fields:
    entry_id:
      required: true
      selector:
        text:
    key:
      required: true
      example: "up"
      selector:
        text:

take_screenshot:
  fields:
    entry_id:
      required: true
      selector:
        text:

run_script:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    filename: {required: true, example: "update_all.sh", selector: {text: {}}}

launch:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    path: {required: true, example: "/media/fat/menu.rbf", selector: {text: {}}}

launch_token:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    data: {required: true, example: "**random:snes", selector: {text: {}}}

set_ini_value:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    key: {required: true, example: "vga_scaler", selector: {text: {}}}
    value: {required: true, example: "1", selector: {text: {}}}

set_wallpaper:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    filename: {required: true, example: "snatcher.png", selector: {text: {}}}

set_background_mode:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    mode: {required: true, example: 2, selector: {number: {min: 0, max: 14, step: 2, mode: box}}}

send_keyboard_raw:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    code: {required: true, example: 28, selector: {number: {min: 0, max: 255, mode: box}}}

create_shortcut:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    game_path: {required: true, selector: {text: {}}}
    folder: {required: true, example: "_@Favorites", selector: {text: {}}}
    name: {required: true, selector: {text: {}}}

delete_screenshot:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    core: {required: true, example: "SNES", selector: {text: {}}}
    filename: {required: true, example: "20260101_120000-Chrono.png", selector: {text: {}}}

send_command:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    command: {required: true, example: "load_core /media/fat/menu.rbf", selector: {text: {}}}

gamepad_press:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    button:
      required: true
      example: "start"
      selector:
        select:
          options: [a, b, x, y, l, r, select, start, home, up, down, left, right]
    action:
      default: "tap"
      selector:
        select:
          options: [tap, down, up]

set_ra_debug:
  fields:
    entry_id: {required: true, selector: {text: {}}}
    enabled: {required: true, selector: {boolean: {}}}
